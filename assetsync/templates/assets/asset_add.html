{% extends 'assets/base.html' %}

{% block content %}
<div style="max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; border: 1px solid #e2e8f0;">
    <h2 style="font-size: 1.5rem; color: #1e293b; margin-bottom: 5px;">Register Asset Item</h2>
    <p style="color: #64748b; margin-bottom: 25px; font-size: 0.9rem;">Zimbabwe Electricity Supply Authority Audit Sheet Input</p>

    <form method="POST" action="{% url 'assets:asset_add' %}">
        {% csrf_token %}
        
        <!-- Row 1: Asset Tag (Compulsory) & Serial Number (Optional) -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div>
                <label style="display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.85rem;">Asset Tag / Number <span style="color: #dc2626;">*</span></label>
                <input type="text" name="asset_tag" placeholder="e.g. ZESA-HR-001" required style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;">
            </div>
            <div>
                <label style="display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.85rem;">Serial Number <span style="color: #94a3b8; font-weight: 400;">(Optional)</span></label>
                <input type="text" name="serial_number" placeholder="e.g. SN-987654 (Leave blank if none)" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;">
            </div>
        </div>

        <!-- Row 2: Description & Category -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div>
                <label style="display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.85rem;">Description of Item</label>
                <input type="text" name="name" placeholder="e.g. DESK, STEEL CABINET" required style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;">
            </div>
            <div>
                <label style="display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.85rem;">Category</label>
                <select name="category" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;">
                    <option value="Furniture">Furniture (Desks, Chairs, Cabinets)</option>
                    <option value="Appliance">Appliances (Heaters, Fans, Microwave)</option>
                    <option value="Electronics">Electronics &amp; IT Equipment</option>
                </select>
            </div>
        </div>

        <!-- Row 3: Region & Department -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div>
                <label style="display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.85rem;">ZESA Region <span style="color: #dc2626;">*</span></label>
                <select name="region" required style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;">
                    <option value="Harare">Harare Region (based in Harare)</option>
                    <option value="Northern">Northern Region (based in Chinhoyi)</option>
                    <option value="Southern">Southern Region (based in Gweru)</option>
                    <option value="Eastern">Eastern Region (based in Mutare)</option>
                    <option value="Western">Western Region (based in Bulawayo)</option>
                </select>
            </div>
            <div>
                <label style="display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.85rem;">Department</label>
                <select name="department" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;">
                    <option value="Administration">Administration</option>
                    <option value="IT">IT Department</option>
                    <option value="Finance">Finance</option>
                    <option value="Procurement">Procurement</option>
                    <option value="HR">Human Resources</option>
                    <option value="Operations">Operations</option>
                    <option value="Executive">Executive</option>
                </select>
            </div>
        </div>

        <!-- Row 4: Physical Location & Office Number -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div>
                <label style="display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.85rem;">Physical Location / Building</label>
                <select name="current_location" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;">
                    <option value="">-- Select Location --</option>
                    {% for loc in locations %}
                        <option value="{{ loc.id }}">{{ loc.building }} - Floor {{ loc.floor }} (Room {{ loc.room_number }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label style="display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.85rem;">Audited Office No.</label>
                <input type="text" name="office_number" placeholder="e.g. 104" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;">
            </div>
        </div>

        <!-- Row 5: Custodian & Condition -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div>
                <label style="display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.85rem;">Assigned Custodian / User</label>
                <input type="text" name="assigned_to" placeholder="e.g. John Doe" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;">
            </div>
            <div>
                <label style="display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.85rem;">Condition / State</label>
                <select name="condition" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;">
                    <option value="Good">Good</option>
                    <option value="Fair">Fair</option>
                    <option value="Needs Repair">Needs Repair</option>
                    <option value="Damaged">Damaged</option>
                </select>
            </div>
        </div>

        <!-- Row 6: Auditor & Date Checked -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <div>
                <label style="display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.85rem;">Audited / Checked By</label>
                <input type="text" name="checked_by" placeholder="e.g. Auditor Name" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;">
            </div>
            <div>
                <label style="display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.85rem;">Date Checked</label>
                <input type="date" name="date_checked" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 0.9rem;">
            </div>
        </div>

        <!-- Form Action Buttons -->
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
            <a href="{% url 'assets:asset_sync_workspace' %}" style="padding: 10px 20px; background: #f1f5f9; color: #475569; text-decoration: none; border-radius: 6px; font-size: 0.9rem; font-weight: 500;">Cancel</a>
            <button type="submit" style="padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 500;">Save Asset</button>
        </div>
    </form>
</div>
{% endblock %}
